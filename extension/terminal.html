<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <header id="tabbar">
    <div id="tabs" role="tablist"></div>
    <div id="tabbar-actions">
      <button id="new-tab" title="New tab (Ctrl+Shift+T) · right-click for profiles">+</button>
      <button id="profile-menu-btn" class="small" title="New tab with profile…">&#9662;</button>
      <button id="split-right" title="Split right (Ctrl+Shift+D)">&#9707;</button>
      <button id="split-down" title="Split down (Ctrl+Shift+E)">&#9636;</button>
      <button id="open-options" title="Settings">&#9881;</button>
    </div>
  </header>
  <main id="panes"></main>

  <template id="pane-template">
    <section class="pane" role="tabpanel">
      <div class="term"></div>
      <div class="findbar hidden">
        <input class="find-input" type="text" placeholder="Find" spellcheck="false">
        <button class="find-case toggle" aria-pressed="false" title="Match case">Aa</button>
        <button class="find-regex toggle" aria-pressed="false" title="Regular expression">.*</button>
        <span class="find-count"></span>
        <button class="find-prev" title="Previous (Shift+Enter)">&#9650;</button>
        <button class="find-next" title="Next (Enter)">&#9660;</button>
        <button class="find-close" title="Close (Esc)">&times;</button>
      </div>
      <div class="paste-guard hidden">
        <div class="paste-card">
          <p class="paste-summary"></p>
          <pre class="paste-preview"></pre>
          <div class="paste-actions">
            <button class="paste-confirm">Paste</button>
            <button class="paste-oneline">Paste as one line</button>
            <button class="paste-cancel">Cancel</button>
          </div>
        </div>
      </div>
      <div class="overlay hidden">
        <div class="overlay-card">
          <h2 class="overlay-title"></h2>
          <p class="overlay-detail"></p>
          <pre class="overlay-code hidden"></pre>
          <div class="overlay-actions">
            <button class="overlay-retry">Reconnect</button>
            <button class="overlay-close">Close pane</button>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="shared.js"></script>
  <script src="session.js"></script>
  <script src="workspace.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
